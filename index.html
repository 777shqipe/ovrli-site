<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ovrli</title>
<meta name="description" content="Ovrli — replica le pose fotografiche. Sovrapponi una foto di riferimento al mirino e allinea l'inquadratura prima di scattare.">
<style>
  :root{--bg:#0b0c0f;--fg:#f4f5f7;--muted:#a6acba;--accent:#ff8a5b;--line:#252833;--pill:#1c1f27}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"SF Pro Text",Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;display:flex;flex-direction:column;padding:0 16px}
  .wrap{max-width:640px;margin:auto;padding:64px 0;text-align:center}
  .brand{font-weight:800;font-size:16px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
  h1{font-size:44px;line-height:1.1;letter-spacing:-.03em;margin:.3em 0 .2em}
  p.tag{color:var(--muted);font-size:18px;max-width:34ch;margin:0 auto 32px}
  .links{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:8px}
  a.btn{text-decoration:none;font-weight:600;font-size:15px;padding:12px 22px;border-radius:999px;
    border:1px solid var(--line);background:var(--pill);color:var(--fg)}
  a.btn.primary{background:var(--accent);border-color:var(--accent);color:#0b0c0f}
  footer{color:var(--muted);font-size:13px;text-align:center;padding:24px 0}
  a{color:var(--accent)}
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">Ovrli</div>
    <h1>Replica ogni posa.</h1>
    <p class="tag">Sovrapponi una foto di riferimento al mirino, allinea l'inquadratura e scatta. Tutto sul tuo iPhone.</p>
    <div class="links">
      <a class="btn primary" href="/privacy">Privacy Policy</a>
      <a class="btn" href="mailto:hello@ovrli.me">Contatti</a>
    </div>
  </div>
  <footer>© 2026 Ovrli · <a href="mailto:hello@ovrli.me">hello@ovrli.me</a></footer>
</body>
</html>
